# Directory structure for the project
DATA_DIR: "data/"
ANALYSIS_DIR: "analysis/"
PLOTS_DIR: "plots/"
LOG_DIR: "logs/"
# Logging level
LOG_LEVEL: "DEBUG"

INPUT_COUNTS:
  transcriptomics: 
    file: "Supplementary table 1 transcriptomic results.xlsx"
    var_columns: 2
    index_column: "converted_alias"
    gene_name_column: "name"
  proteomics: 
    file: "Supplementary table 2 proteomic results.xlsx"
    var_columns: 3
    index_column: "Entry"
    gene_name_column: "Gene Names (primary)"

ENSEMBL_ASSEMBLY_TO_SPECIES_NAME: {
  "hg38": "hsapiens",
  "mm10": "mmusculus",
}

ASSEMBLY: "hg38"
ARCHIVE_NAME: "jul2023.archive"

SenCID:
  ANALYSIS_DIR: "analysis/"
  SENCID_SAMPLES: ["counts"]
  SENCID_DENOISING: 'f'

NORMALIZATION_DESIGN:
  Matts: "sample"

COMMON_SEN_MARKERS:
  Canonical: "config/Canonical_gene_markers.csv"
